<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glow Garden</title>
<meta name="description" content="A glowing garden that never stops: butterflies, flowers, fireflies, day and night.">
<style>
  html,body{margin:0;height:100%;background:#03040c;overflow:hidden;touch-action:none}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font:12px system-ui,sans-serif;color:#d9e6ff;opacity:0;
    transition:opacity 1.5s;pointer-events:none;text-shadow:0 0 8px #000}
  #back{position:fixed;left:14px;top:12px;font:14px system-ui,sans-serif;color:#cfd8ff;opacity:.7;text-decoration:none;z-index:5;text-shadow:0 0 6px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../">&larr;</a>
<div id="hint">tap anywhere to plant a flower</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

let W, H, DPR, U, groundTop;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H * 0.8);
  groundTop = H * (W < H ? 0.6 : 0.64);
  makeScenery();
}

// ---------- glow sprites (cached radial gradients, cheap to draw) ----------
const spriteCache = new Map();
function glow(h, s = 100, l = 65){
  const key = `${Math.round(h / 6) * 6}|${s}|${l}`;
  let c = spriteCache.get(key);
  if (!c) {
    c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `hsla(${h},${s}%,${l}%,1)`);
    gr.addColorStop(0.25, `hsla(${h},${s}%,${l}%,0.45)`);
    gr.addColorStop(1, `hsla(${h},${s}%,${l}%,0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    spriteCache.set(key, c);
  }
  return c;
}
function drawGlow(x, y, r, h, a, s, l){
  if (a <= 0.003) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(glow(h, s, l), x - r, y - r, r * 2, r * 2);
}

// ---------- day / night ----------
const CYCLE = 100;                       // seconds for a full day
const SKY = [                            // p: 0 = midnight
  {p: 0.00, top: [2, 3, 12],    bot: [12, 16, 44],   dark: 1},
  {p: 0.20, top: [2, 3, 12],    bot: [12, 16, 44],   dark: 1},
  {p: 0.28, top: [30, 24, 70],  bot: [214, 120, 128], dark: 0.45},
  {p: 0.36, top: [34, 92, 150], bot: [150, 205, 214], dark: 0},
  {p: 0.58, top: [34, 92, 150], bot: [150, 205, 214], dark: 0},
  {p: 0.66, top: [44, 26, 80],  bot: [238, 132, 92],  dark: 0.45},
  {p: 0.75, top: [2, 3, 12],    bot: [12, 16, 44],   dark: 1},
  {p: 1.00, top: [2, 3, 12],    bot: [12, 16, 44],   dark: 1},
];
function skyAt(p){
  let i = 0; while (SKY[i + 1].p < p) i++;
  const a = SKY[i], b = SKY[i + 1], t = smooth(a.p, b.p, p);
  const mix = (x, y) => x.map((v, k) => Math.round(lerp(v, y[k], t)));
  return {top: mix(a.top, b.top), bot: mix(a.bot, b.bot), dark: lerp(a.dark, b.dark, t)};
}

// ---------- scenery ----------
let stars = [], hills = [], grass = [];
function makeScenery(){
  stars = Array.from({length: Math.round(W * H / 5000)}, () => ({x: rand(0, W), y: rand(0, groundTop * 0.95), r: rand(0.4, 1.4), ph: rand(0, TAU), sp: rand(0.5, 2)}));
  hills = [0, 1].map(k => ({k, a: Array.from({length: 4}, () => [rand(0.002, 0.012), rand(0, TAU), rand(8, 26)])}));
  grass = [];
  const n = Math.round(W / 3.2);
  for (let i = 0; i < n; i++) {
    const depth = Math.random();
    grass.push({x: rand(-10, W + 10), depth, h: rand(0.05, 0.1) * U * (0.5 + depth * 0.7), ph: rand(0, TAU), hue: rand(120, 160), lean: rand(-0.25, 0.25)});
  }
  grass.sort((a, b) => a.depth - b.depth);
}
const baseYOf = d => groundTop + 8 + d * (H - groundTop - 18);
const scaleOf = d => 0.45 + d * 0.75;

// ---------- wind ----------
let gust = 0, nextGust = rand(10, 18);
function windAt(t){ return 0.18 * Math.sin(t * 0.31) + 0.12 * Math.sin(t * 0.83 + 1) + gust; }

// ---------- flowers ----------
const TYPES = ['daisy', 'tulip', 'rose', 'puff', 'daisy', 'rose'];
const HUES = [330, 350, 300, 275, 200, 45, 20, 185, 315, 260];
let flowers = [];
function makeFlower(x, depth, opts = {}){
  const s = scaleOf(depth);
  const type = opts.type || TYPES[Math.floor(Math.random() * TYPES.length)];
  const f = {
    x, depth, type, hue: (opts.hue ?? HUES[Math.floor(Math.random() * HUES.length)]) + rand(-8, 8),
    stemH: U * rand(0.2, 0.36) * s, size: U * rand(0.05, 0.072) * s * (type === 'puff' ? 1.15 : 1),
    age: opts.age ?? 0, life: rand(40, 80), speed: opts.speed || 1,
    ph: rand(0, TAU), rot: rand(0, TAU), n: Math.floor(rand(7, 12)), bend: rand(-0.25, 0.25),
    dots: Array.from({length: 34}, () => [rand(0, TAU), Math.sqrt(Math.random())]),
    leaf: rand(0.3, 0.55), leafSide: Math.random() < 0.5 ? -1 : 1,
    taken: null,
  };
  return f;
}
function flowerState(f){
  const a = f.age;
  const grow = smooth(0, 3, a), open = smooth(2.4, 5.5, a);
  const wilt = smooth(f.life, f.life + 5, a);
  return {grow, open: open * (1 - wilt * 0.85), wilt, bloomed: open > 0.7 && wilt < 0.1, dead: a > f.life + 6};
}
function headPos(f, t, wind){
  const st = flowerState(f);
  const h = f.stemH * st.grow * (1 - st.wilt * 0.25);
  const sway = wind * h * 0.35 * (0.7 + f.depth * 0.3) + Math.sin(t * 1.3 + f.ph) * h * 0.035;
  const droop = st.wilt * f.stemH * 0.25;
  return {x: f.x + sway + f.bend * h * 0.3 + droop * (f.bend >= 0 ? 0.8 : -0.8), y: baseYOf(f.depth) - h + droop, st};
}

// ---------- butterflies ----------
let flies = [];
const BF_COLORS = [[195, 170], [285, 320], [45, 20], [165, 130], [330, 300], [230, 195], [15, 345]];
function makeFly(i){
  const [hue, hue2] = BF_COLORS[i % BF_COLORS.length];
  const side = Math.random() < 0.5 ? -1 : 1;
  return {
    x: side < 0 ? -40 : W + 40, y: rand(H * 0.2, groundTop), vx: 0, vy: 0,
    hue, hue2, size: U * rand(0.042, 0.058), state: 'fly', target: null, timer: 0,
    flap: rand(0, TAU), flapSp: rand(15, 19), wob: rand(0, TAU), roam: null, dust: 0,
  };
}
function pickFlower(b, prefer){
  const cands = flowers.filter(f => f.taken === null && flowerState(f).bloomed && f.age < f.life - 6);
  if (!cands.length) return null;
  if (prefer && cands.includes(prefer)) return prefer;
  // prefer something not too close, not too far
  cands.sort(() => Math.random() - 0.5);
  return cands[0];
}

// ---------- particles ----------
let parts = [];          // petals, pollen, dust, sparks
let fireflies = [];
function makeFirefly(){ return {x: rand(0, W), y: rand(H * 0.25, H * 0.95), ph: rand(0, TAU), sp: rand(0.4, 1), bl: rand(0, TAU), bs: rand(1.5, 3.5)}; }

// ---------- setup ----------
let startP = 0.6;        // begin late afternoon, heading into a glowing night
function populate(){
  flowers = [];
  const n = Math.round(clamp(W / 30, 20, 46));
  for (let i = 0; i < n; i++) {
    const x = (i + rand(0.1, 0.9)) / n * W;
    flowers.push(makeFlower(x, Math.random(), {age: -rand(0, 3.5)}));
  }
  flies = Array.from({length: W < 600 ? 5 : 8}, (_, i) => makeFly(i));
  fireflies = Array.from({length: Math.round(clamp(W / 25, 18, 50))}, makeFirefly);
  parts = [];
}
resize(); populate();
addEventListener('resize', () => { resize(); for (const f of fireflies) { f.x = rand(0, W); f.y = rand(H * 0.25, H * 0.95); } });

// ---------- touch: plant a flower ----------
let lastTap = -99;
addEventListener('pointerdown', e => {
  const x = e.clientX, y = e.clientY;
  const depth = y > groundTop ? clamp((y - groundTop - 8) / (H - groundTop - 18), 0, 1) : rand(0.55, 1);
  const f = makeFlower(x, depth, {speed: 2.2});
  flowers.push(f);
  for (let i = 0; i < 18; i++) {
    const a = rand(0, TAU), sp = rand(30, 120);
    parts.push({k: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.6, 1.2), age: 0, hue: f.hue});
  }
  // the nearest awake butterfly comes to see it
  let best = null, bd = 1e9;
  for (const b of flies) { if (b.state === 'sleep') continue; const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = b; } }
  if (best) { if (best.target) best.target.taken = null; best.state = 'fly'; best.target = null; best.wantFlower = f; }
  const alive = flowers.filter(f => !flowerState(f).wilt);
  if (alive.length > 60) { const old = alive.reduce((a, b) => (a.life - a.age) < (b.life - b.age) ? a : b); old.age = Math.max(old.age, old.life); }
  lastTap = now;
  hint.style.opacity = 0;
});

// ---------- update ----------
let now = 0, last = performance.now() / 1000;
const T0 = last;
function update(dt, t, wind, dark){
  // gusts
  nextGust -= dt;
  if (nextGust < 0) { gustTarget = rand(0.7, 1.3) * (Math.random() < 0.2 ? -0.6 : 1); gustTime = 0; nextGust = rand(14, 26); }
  if (gustTime >= 0) {
    gustTime += dt;
    gust = gustTarget * (smooth(0, 1.2, gustTime) - smooth(1.8, 5, gustTime));
    if (gustTime > 5) { gustTime = -1; gust = 0; }
    if (gustTime > 0.8 && gustTime < 3 && Math.random() < dt * 14) {     // petals fly off in the gust
      const f = flowers[Math.floor(Math.random() * flowers.length)];
      if (f && flowerState(f).bloomed) { const hp = headPos(f, t, wind); parts.push(petal(hp.x, hp.y, f)); }
    }
  }

  // flowers: age, shed petals while wilting, respawn
  for (const f of flowers) {
    f.age += dt * (f.age < 6 ? f.speed : 1);
    const st = flowerState(f);
    if (st.wilt > 0 && st.wilt < 1 && Math.random() < dt * 3) { const hp = headPos(f, t, wind); parts.push(petal(hp.x, hp.y, f)); }
  }
  const before = flowers.length;
  flowers = flowers.filter(f => !flowerState(f).dead);
  for (let i = flowers.length; i < before; i++) {
    // a new one sprouts somewhere else
    const x = rand(0.03, 0.97) * W;
    flowers.push(makeFlower(x, Math.random()));
  }
  for (const b of flies) if (b.target && !flowers.includes(b.target)) { b.target = null; b.state = 'fly'; }

  // butterflies
  for (const b of flies) {
    b.flap += dt * (b.state === 'fly' ? b.flapSp : 2);
    b.wob += dt;
    if (b.state === 'fly') {
      if (!b.target) {
        const want = b.wantFlower && flowerState(b.wantFlower).bloomed ? b.wantFlower : null;
        if (want && want.taken === null) { b.target = want; want.taken = b; b.wantFlower = null; }
        else if (!b.roam || (b.timer -= dt) < 0) {
          const f = (!b.wantFlower && Math.random() < 0.75) || dark > 0.8 ? pickFlower(b) : null;
          if (f) { b.target = f; f.taken = b; }
          else { b.roam = {x: rand(0.05, 0.95) * W, y: rand(0.15, 0.75) * H}; b.timer = rand(2, 5); }
        }
      }
      let tx, ty;
      if (b.target) { const hp = headPos(b.target, t, wind); tx = hp.x; ty = hp.y - b.target.size * 0.55; }
      else { tx = b.roam.x; ty = b.roam.y; }
      const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy) || 1;
      const maxV = U * (b.target && d < U * 0.15 ? 0.22 : 0.4);
      const ax = dx / d * U * 0.9 + Math.sin(b.wob * 2.3) * U * 0.6;
      const ay = dy / d * U * 0.9 + Math.sin(b.wob * 3.1 + 1) * U * 0.7;
      b.vx += ax * dt; b.vy += ay * dt;
      const v = Math.hypot(b.vx, b.vy); if (v > maxV) { b.vx *= maxV / v; b.vy *= maxV / v; }
      b.vx += wind * U * 0.25 * dt * 4;
      b.x += b.vx * dt; b.y += b.vy * dt + Math.sin(b.flap) * 0.35;
      if (b.target && d < Math.max(6, U * 0.012)) { b.state = 'perch'; b.timer = rand(3, 9); b.vx = b.vy = 0; }
      if (!b.target && d < 20) b.timer = 0;
      // glitter trail
      b.dust += dt;
      if (b.dust > 0.06) { b.dust = 0; parts.push({k: 'dust', x: b.x, y: b.y + b.size * 0.2, vx: rand(-8, 8), vy: rand(4, 18), life: rand(0.6, 1.3), age: 0, hue: b.hue}); }
    } else {
      const f = b.target;
      const hp = headPos(f, t, wind);
      b.x = hp.x; b.y = hp.y - f.size * 0.55;
      const st = hp.st;
      if (b.state === 'perch') {
        b.timer -= dt;
        if (dark > 0.85) b.state = 'sleep';
        else if (b.timer < 0 || st.wilt > 0 || b.wantFlower) { f.taken = null; b.target = null; b.state = 'fly'; b.vy = -U * 0.2; b.roam = null; }
      } else if (b.state === 'sleep') {
        if (dark < 0.6) { b.state = 'perch'; b.timer = rand(1, 4); }
        if (st.wilt > 0) { f.taken = null; b.target = null; b.state = 'fly'; }
      }
    }
    // keep them roughly on screen
    if (b.state === 'fly') {
      if (b.x < -60) b.vx += U * dt * 3; if (b.x > W + 60) b.vx -= U * dt * 3;
      if (b.y < 20) b.vy += U * dt * 3; if (b.y > H - 20) b.vy -= U * dt * 3;
    }
  }

  // ambient pollen in daylight / dusk
  if (Math.random() < dt * 6 * (1 - dark * 0.7)) parts.push({k: 'pollen', x: rand(0, W), y: rand(groundTop - H * 0.25, H), vx: rand(-6, 6), vy: rand(-10, -3), life: rand(4, 8), age: 0, hue: rand(40, 60)});

  // particles
  for (const p of parts) {
    p.age += dt;
    if (p.k === 'petal') {
      p.vx += (wind * U * 0.5 - p.vx) * dt * 0.8; p.vy = lerp(p.vy, U * 0.05, dt);
      p.x += p.vx * dt + Math.sin(p.age * 3 + p.ph) * 0.6; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > p.floor) { p.y = p.floor; p.vx = p.vy = 0; p.vr = 0; }
    } else {
      p.x += (p.vx + wind * 20) * dt; p.y += p.vy * dt;
      if (p.k === 'spark') { p.vx *= 0.94; p.vy = p.vy * 0.94 + 30 * dt; }
    }
  }
  parts = parts.filter(p => p.age < p.life && p.x > -50 && p.x < W + 50);

  // fireflies
  for (const f of fireflies) {
    f.ph += dt * f.sp;
    f.x += Math.cos(f.ph * 1.3) * 12 * dt + wind * 15 * dt;
    f.y += Math.sin(f.ph * 0.9 + f.bl) * 9 * dt;
    if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10;
    if (f.y < H * 0.2) f.y += 1; if (f.y > H) f.y -= 1;
  }
}
let gustTarget = 0, gustTime = -1;
function petal(x, y, f){
  return {k: 'petal', x, y, vx: rand(-15, 15), vy: rand(-10, 10), rot: rand(0, TAU), vr: rand(-4, 4), ph: rand(0, TAU),
    life: rand(5, 9), age: 0, hue: f.hue, size: f.size * 0.45, floor: baseYOf(f.depth) + rand(-4, 6)};
}

// ---------- drawing ----------
function drawSky(sky, p, t){
  const g = ctx.createLinearGradient(0, 0, 0, groundTop + 40);
  g.addColorStop(0, `rgb(${sky.top})`); g.addColorStop(1, `rgb(${sky.bot})`);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  if (sky.dark > 0.05) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = sky.dark * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
  }
  // moon across the night, sun across the day
  const nightA = ((p - 0.72 + 1) % 1) / 0.58, dayA = (p - 0.26) / 0.48;
  if (nightA >= 0 && nightA <= 1) {
    const x = W * (0.1 + 0.8 * nightA), y = groundTop * 0.85 - Math.sin(nightA * Math.PI) * groundTop * 0.62;
    const r = U * 0.045;
    drawGlow(x, y, r * 7, 215, 0.35 * sky.dark, 60, 75);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.min(1, sky.dark * 1.3);
    ctx.fillStyle = '#eef2ff'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(160,170,210,0.35)';
    for (const [ox, oy, rr] of [[-0.3, -0.2, 0.22], [0.25, 0.15, 0.16], [0.05, 0.4, 0.12]]) { ctx.beginPath(); ctx.arc(x + ox * r, y + oy * r, rr * r, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = 'lighter';
  }
  if (dayA >= 0 && dayA <= 1) {
    const x = W * (0.12 + 0.76 * dayA), y = groundTop * 0.9 - Math.sin(dayA * Math.PI) * groundTop * 0.7;
    drawGlow(x, y, U * 0.5, 40, 0.55 * (1 - sky.dark), 100, 75);
    drawGlow(x, y, U * 0.08, 50, 0.95 * (1 - sky.dark), 100, 92);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawGround(sky){
  // two hill silhouettes and the meadow
  const dk = 1 - sky.dark;
  hills.forEach((hl, k) => {
    const yb = groundTop - (k === 0 ? U * 0.12 : U * 0.04);
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) {
      let y = yb; for (const [f, ph, a] of hl.a) y += Math.sin(x * f + ph) * a * (U / 500);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath();
    const c = k === 0 ? [lerp(10, 60, dk), lerp(14, 96, dk), lerp(34, 110, dk)] : [lerp(6, 34, dk), lerp(14, 74, dk), lerp(22, 60, dk)];
    ctx.globalAlpha = 1; ctx.fillStyle = `rgb(${c.map(Math.round)})`; ctx.fill();
  });
  const g = ctx.createLinearGradient(0, groundTop, 0, H);
  g.addColorStop(0, `rgb(${[lerp(6, 40, dk), lerp(18, 84, dk), lerp(20, 50, dk)].map(Math.round)})`);
  g.addColorStop(1, `rgb(${[lerp(2, 16, dk), lerp(6, 40, dk), lerp(8, 22, dk)].map(Math.round)})`);
  ctx.fillStyle = g; ctx.fillRect(0, groundTop, W, H - groundTop);
}

function drawGrass(list, t, wind, sky){
  const dk = 1 - sky.dark;
  ctx.lineCap = 'round';
  for (const g of list) {
    const by = baseYOf(g.depth);
    const tipX = g.x + (wind * 0.6 + g.lean) * g.h + Math.sin(t * 1.7 + g.ph) * g.h * 0.06;
    ctx.strokeStyle = `hsl(${g.hue},${lerp(45, 50, dk)}%,${lerp(9, 30, dk) + g.depth * lerp(8, 14, dk)}%)`;
    ctx.lineWidth = 1 + g.depth * 1.6;
    ctx.beginPath(); ctx.moveTo(g.x, by); ctx.quadraticCurveTo(g.x, by - g.h * 0.6, tipX, by - g.h); ctx.stroke();
  }
}

function drawFlower(f, t, wind, glowK, dk){
  const hp = headPos(f, t, wind), st = hp.st;
  if (st.grow <= 0) return;
  const bx = f.x, by = baseYOf(f.depth);
  // stem
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = `hsl(${lerp(130, 60, st.wilt)},${lerp(45, 30, st.wilt)}%,${lerp(16, 34, dk)}%)`;
  ctx.lineWidth = Math.max(1.2, f.size * 0.12);
  const cx = lerp(bx, hp.x, 0.3), cy = lerp(by, hp.y, 0.55);
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(cx, cy, hp.x, hp.y); ctx.stroke();
  // leaf
  if (st.grow > 0.5) {
    const lx = lerp(bx, cx, f.leaf * 1.6), ly = lerp(by, cy, f.leaf * 1.6);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(f.leafSide * 0.9 + wind * 0.3);
    ctx.beginPath(); ctx.ellipse(f.leafSide * f.size * 0.55, 0, f.size * 0.6 * st.grow, f.size * 0.18, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  const o = st.open, s = f.size;
  // bud
  if (o < 0.15) {
    ctx.fillStyle = `hsl(${f.hue},60%,${lerp(30, 50, dk)}%)`;
    ctx.beginPath(); ctx.ellipse(hp.x, hp.y, s * 0.22, s * 0.32, 0, 0, TAU); ctx.fill();
  }
  if (o <= 0.02) return;
  const sat = lerp(95, 35, st.wilt), L = lerp(66, 45, st.wilt);
  // glow behind the head
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(hp.x, hp.y, s * (3.2 + glowK * 2), f.hue, 0.6 * glowK * o, 100, 60);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.translate(hp.x, hp.y); ctx.rotate(wind * 0.25 + Math.sin(t + f.ph) * 0.05);
  ctx.globalAlpha = 0.92;
  if (f.type === 'daisy') {
    ctx.fillStyle = `hsl(${f.hue},${sat}%,${L + 8}%)`;
    for (let i = 0; i < f.n; i++) {
      ctx.save(); ctx.rotate(f.rot + i * TAU / f.n);
      ctx.beginPath(); ctx.ellipse(s * 0.55 * o, 0, s * 0.55 * o, s * 0.17, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = `hsl(45,100%,${lerp(55, 65, glowK)}%)`;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.24, 0, TAU); ctx.fill();
  } else if (f.type === 'tulip') {
    const w = s * (0.35 + 0.3 * o), h = s * 0.95;
    for (const [dx, k, lt] of [[-0.45, -0.25, 0], [0.45, 0.25, 0], [0, 0, 10]]) {
      ctx.fillStyle = `hsl(${f.hue},${sat}%,${L - 6 + lt}%)`;
      ctx.save(); ctx.translate(dx * w * 0.6, 0); ctx.rotate(k * o);
      ctx.beginPath(); ctx.moveTo(0, h * 0.35);
      ctx.bezierCurveTo(w * 0.9, h * 0.3, w * 0.7, -h * 0.5, 0, -h * 0.6);
      ctx.bezierCurveTo(-w * 0.7, -h * 0.5, -w * 0.9, h * 0.3, 0, h * 0.35);
      ctx.fill(); ctx.restore();
    }
  } else if (f.type === 'rose') {
    for (let k = 0; k < 4; k++) {
      const r = s * (0.95 - k * 0.2) * (0.4 + 0.6 * o);
      ctx.fillStyle = `hsl(${f.hue},${sat}%,${L - 14 + k * 9}%)`;
      for (let j = 0; j < 5; j++) {
        const a = f.rot + j * TAU / 5 + k * 0.6;
        ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42, r * 0.55, 0, TAU); ctx.fill();
      }
    }
    ctx.strokeStyle = `hsla(${f.hue},100%,85%,0.6)`; ctx.lineWidth = 1;
    ctx.beginPath(); for (let a = 0; a < 9; a += 0.3) { const r = s * 0.03 * a * o; ctx.lineTo(Math.cos(a + f.rot) * r, Math.sin(a + f.rot) * r); } ctx.stroke();
  } else {
    ctx.globalCompositeOperation = 'lighter';
    for (const [a, r] of f.dots) {
      const x = Math.cos(a) * r * s * 0.95 * o, y = Math.sin(a) * r * s * 0.95 * o;
      drawGlow(x, y, s * 0.28, f.hue, 0.9 * o, 100, L + 10);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function wingPath(s){
  const p = new Path2D();
  // upper wing
  p.moveTo(0, -s * 0.05);
  p.bezierCurveTo(s * 0.55, -s * 1.15, s * 1.3, -s * 0.85, s * 1.0, -s * 0.08);
  p.bezierCurveTo(s * 0.75, s * 0.12, s * 0.3, s * 0.05, 0, s * 0.02);
  // lower wing
  p.moveTo(0, s * 0.02);
  p.bezierCurveTo(s * 0.6, s * 0.02, s * 0.9, s * 0.5, s * 0.58, s * 0.85);
  p.bezierCurveTo(s * 0.32, s * 1.0, s * 0.08, s * 0.55, 0, s * 0.18);
  return p;
}
function drawFly(b, glowK, dk){
  const s = b.size;
  let open;
  if (b.state === 'fly') open = 0.1 + 0.9 * Math.abs(Math.cos(b.flap));
  else if (b.state === 'perch') open = 0.45 + 0.4 * Math.sin(b.flap);
  else open = 0.08;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(b.x, b.y, s * (2.0 + glowK * 1.1), b.hue, (0.35 + 0.5 * glowK) * (b.state === 'sleep' ? 0.45 : 1), 100, 62);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.rotate(b.state === 'fly' ? clamp(b.vx / (U * 0.4), -1, 1) * 0.35 : 0);
  const wp = wingPath(s);
  for (const side of [-1, 1]) {
    ctx.save(); ctx.scale(side * open, 1);
    const g = ctx.createRadialGradient(s * 0.25, -s * 0.15, 0, s * 0.35, -s * 0.1, s * 1.2);
    g.addColorStop(0, `hsla(${b.hue2},100%,${lerp(88, 80, dk)}%,0.98)`);
    g.addColorStop(0.45, `hsla(${b.hue},100%,62%,0.9)`);
    g.addColorStop(1, `hsla(${b.hue},100%,38%,0.75)`);
    ctx.fillStyle = g; ctx.fill(wp);
    ctx.strokeStyle = `hsla(${b.hue2},100%,90%,0.55)`; ctx.lineWidth = 0.8; ctx.stroke(wp);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const [x, y, r] of [[0.85, -0.35, 0.07], [0.7, -0.6, 0.05], [0.45, 0.6, 0.05]]) { ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  // body + antennae
  ctx.fillStyle = `hsl(${b.hue},40%,${lerp(20, 18, dk)}%)`;
  ctx.beginPath(); ctx.ellipse(0, s * 0.1, s * 0.08, s * 0.45, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = `hsla(${b.hue2},80%,80%,0.8)`; ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(0, -s * 0.3); ctx.quadraticCurveTo(side * s * 0.12, -s * 0.6, side * s * 0.28, -s * 0.72); ctx.stroke();
    ctx.beginPath(); ctx.arc(side * s * 0.28, -s * 0.72, 1.4, 0, TAU); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  ctx.restore();
}

function drawParticles(glowK, dark){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const life = 1 - p.age / p.life;
    if (p.k === 'petal') continue;
    if (p.k === 'dust') drawGlow(p.x, p.y, 3 + 3 * life, p.hue, 0.8 * life * (0.4 + glowK * 0.6), 100, 75);
    else if (p.k === 'spark') drawGlow(p.x, p.y, 4 + 6 * life, p.hue, life, 100, 72);
    else if (p.k === 'pollen') drawGlow(p.x, p.y, 3.5, p.hue, 0.55 * Math.sin(life * Math.PI), 100, 78);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of parts) {
    if (p.k !== 'petal') continue;
    const life = 1 - p.age / p.life;
    ctx.globalAlpha = Math.min(1, life * 2) * 0.85;
    ctx.fillStyle = `hsl(${p.hue},80%,62%)`;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.4 * Math.abs(Math.cos(p.rot * 1.3)) + 0.5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFireflies(t, dark){
  if (dark < 0.05) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies) {
    const b = Math.pow(0.5 + 0.5 * Math.sin(t * f.bs + f.bl), 3);
    drawGlow(f.x, f.y, 10 + 6 * b, 75, dark * (0.15 + 0.85 * b), 100, 65);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// ---------- main loop ----------
function frame(){
  const real = performance.now() / 1000;
  const dt = Math.min(0.05, real - last); last = real;
  now = real - T0;
  const p = (startP + now / CYCLE) % 1;
  const sky = skyAt(p);
  const dark = sky.dark, glowK = 0.35 + 0.65 * dark, dk = 1 - dark;
  const wind = windAt(now);
  update(dt, now, wind, dark);

  drawSky(sky, p, now);
  drawGround(sky);
  // draw back to front in depth slices so grass and flowers overlap naturally
  const sorted = flowers.slice().sort((a, b) => a.depth - b.depth);
  const SL = 5;
  let gi = 0, fi = 0;
  for (let k = 1; k <= SL; k++) {
    const lim = k / SL;
    const gs = gi; while (gi < grass.length && grass[gi].depth < lim) gi++;
    drawGrass(grass.slice(gs, gi), now, wind, sky);
    while (fi < sorted.length && sorted[fi].depth < lim) drawFlower(sorted[fi++], now, wind, glowK, dk);
  }
  while (fi < sorted.length) drawFlower(sorted[fi++], now, wind, glowK, dk);
  drawParticles(glowK, dark);
  drawFireflies(now, dark);
  for (const b of flies) drawFly(b, glowK, dk);

  if (now > 3 && now < 12 && now - lastTap > 20) hint.style.opacity = 0.85;
  else if (now >= 12) hint.style.opacity = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
