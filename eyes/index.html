<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Connection</title>
<meta name="description" content="Two eyes made entirely of characters. Look closer.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #glow{filter:blur(6px);opacity:.55;mix-blend-mode:screen;pointer-events:none}
  #title{position:fixed;left:0;right:0;top:16px;text-align:center;font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.5em;color:#cfd6e4;opacity:0;transition:opacity 1.2s;pointer-events:none;text-transform:uppercase;text-shadow:0 0 6px #000,0 0 12px #000}
  #back{position:fixed;left:14px;top:12px;font:13px ui-monospace,Menlo,Consolas,monospace;color:#7d8596;text-decoration:none;z-index:5;text-shadow:0 0 6px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="glow"></canvas>
<a id="back" href="../">&larr;</a>
<div id="title">The Connection</div>
<script>
(() => {
const cv = document.getElementById('c'), gl = document.getElementById('glow');
const ctx = cv.getContext('2d'), gctx = gl.getContext('2d');
const title = document.getElementById('title');

// characters grouped by how much "ink" they have
const BANDS = [
  " ", ".'`", ":-,", "~;=", "cvxzunr", "CJUYXLoa", "Q0OZwqe", "pqdbkhmw", "pdbkhMW", "*#&%", "@"
];
const NB = BANDS.length;

let W, H, DPR, fs, cw, ch, cols, rows, N;
let val, chr, tint;   // per-cell buffers

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [cv, gl]) { c.width = W*DPR; c.height = H*DPR; }
  fs = Math.max(7, Math.min(12, Math.round(Math.max(W / 150, H / 95))));
  cw = fs * 0.62; ch = fs * 1.02;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch); N = cols * rows;
  val = new Float32Array(N); chr = new Uint16Array(N); tint = new Uint8Array(N);
  for (const k of [ctx, gctx]) k.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
function hash(x, y){ let h = Math.sin(x*127.1 + y*311.7) * 43758.5453; return h - Math.floor(h); }
function noise(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x-ix, fy = y-iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  const a = hash(ix,iy), b = hash(ix+1,iy), c = hash(ix,iy+1), d = hash(ix+1,iy+1);
  return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
}
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const smooth = (a,b,v) => { const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = (a,b,t) => a+(b-a)*t;
const bump = (t, c, w) => { const d = Math.abs(t - c); return d < w ? Math.cos(d/w*Math.PI/2)**2 : 0; };

// ---------- pointer ----------
let px = 0, py = 0, lastMove = -99;
function onMove(e){
  const p = e.touches ? e.touches[0] : e;
  px = (p.clientX / W) * 2 - 1; py = (p.clientY / H) * 2 - 1; lastMove = performance.now()/1000;
}
addEventListener('mousemove', onMove);
addEventListener('touchmove', onMove, {passive:true});
addEventListener('touchstart', onMove, {passive:true});

// ---------- the face: bright wall of letters, eyes are the dark parts ----------
const EX = 0.5, EW = 0.3, EH = 0.165, RI = 0.12, RP = 0.045;

// returns brightness; sets ORB (0..1) when the pixel is the glowing pupil-sphere
let ORB = 0;
function eye(x, y, ex, s){
  const dx = x - ex, dy = y, u = dx / EW, au = Math.abs(u);
  const socket = Math.hypot(dx / (EW*1.35), (dy + 0.02) / (EH*2.0));
  if (au >= 1) return {inside:false, socket};
  const hh = EH * Math.pow(1 - u*u, 0.8);
  const open = s.open;
  const bot = hh * (0.3 + 0.62*open);
  const top = -hh*open + (1-open)*hh*0.26;
  if (dy < top || dy > bot) {
    const above = top - dy, below = dy - bot;
    // lid creases and lashes read as dark gaps in the letters
    const crease = Math.abs(above - 0.07*(1-au*au)) < 0.012;
    const lash = above > 0 && above < 0.035*(1-au*0.6) && Math.sin(u*48) > 0.2;
    return {inside:false, socket, dark: (above > 0 && above < 0.014) || lash || (below > 0 && below < 0.008) ? 1 : crease ? 0.5 : 0};
  }
  const icx = ex + s.gx*0.11, icy = s.gy*0.05;
  const ix = x - icx, iy = y - icy, d = Math.hypot(ix, iy);
  const rp = RP * s.dil;
  let v;
  if (d < rp) {
    if (s.orb > 0 && ex < 0) {           // the merged sphere living inside the pupil
      const r = d / rp, z = Math.sqrt(Math.max(0, 1 - r*r));
      const nx = ix/rp, ny = iy/rp;
      const dif = Math.max(0, nx*0.45 - ny*0.45 + z*0.77);
      const spec = Math.pow(Math.max(0, nx*0.3 - ny*0.35 + z*0.89), 30);
      ORB = s.orb;
      return {inside:true, v: lerp(0, clamp(0.12 + 0.72*dif + spec, 0, 1), s.orb)};
    }
    v = 0.0;
  } else if (d < RI) {
    const a = Math.atan2(iy, ix), t = (d - rp) / (RI - rp);
    const fib = 0.5 + 0.5*Math.sin(a*22 + noise(a*3 + ex*7, d*25)*6);
    v = 0.12 + 0.36*fib*smooth(0, 0.35, t);
    v *= 1 - smooth(0.78, 1, t)*0.85;          // dark limbal ring
  } else {
    v = 0.36 + 0.14*noise(x*18, y*18);          // the white of the eye: a sparse, dim band
    v *= 0.45 + 0.55*smooth(0, 0.045, Math.min(dy - top, bot - dy));
  }
  const hx = ix + 0.032, hy = iy + 0.034;       // catch-light
  if (s.dil < 1.15 && hx*hx + hy*hy < 0.016*0.016) v = 1;
  if (dy - top < 0.014) v *= 0.1;
  return {inside:true, v};
}

function face(x, y, s){
  ORB = 0;
  const L = eye(x, y, -EX, s);
  if (L.inside) return L.v;
  const R = eye(x, y, EX, s);
  if (R.inside) return R.v;
  // skin: dense and bright, with soft forms
  let v = 0.66 + 0.1*noise(x*3 + 7, y*3) - 0.08*noise(x*14, y*14);
  v += 0.06 * Math.exp(-x*x*30) * smooth(-0.15, 0.3, y);          // nose bridge
  v -= 0.1 * smooth(0.25, 0.6, y) * Math.exp(-x*x*6);              // shadow under the nose
  const sock = Math.min(L.socket, R.socket);
  v *= 0.38 + 0.62*smooth(0.72, 1.4, sock);                          // eye sockets fall into shadow
  // brows: a slightly darker, textured band
  for (const ex of [-EX, EX]) {
    const dx = x - ex, u = dx / (EW*1.15);
    if (Math.abs(u) < 1) {
      const by = -0.27 + 0.06*u*u + (ex < 0 ? 0.02*u : -0.02*u);
      const d = Math.abs(y - by);
      if (d < 0.04) v *= 0.55 + 0.35*Math.abs(Math.sin(dx*90 + y*30));
    }
  }
  if (L.dark || R.dark) v *= 1 - 0.9*Math.max(L.dark || 0, R.dark || 0);
  v *= 1 - smooth(1.0, 1.9, Math.hypot(x/1.2, (y - 0.1)*1.1));       // vignette
  return v;
}

// ---------- inside the pupil ----------
// sparkles: little "+" flares drifting past
const SPARK = Array.from({length: 46}, (_, i) => ({
  x: (hash(i, 1.3) * 2 - 1) * 1.6, y: (hash(i, 7.1) * 2 - 1) * 1.0,
  z: 0.6 + hash(i, 3.7) * 3.4, ph: hash(i, 9.2) * 6.28
}));

function orbs(nx, ny, t){
  // two spheres facing each other, drifting together until they become one
  const R = 0.46;
  const k = smooth(3.0, 5.2, t);
  const sep = lerp(R * 1.07, 0, k);
  let best = 0;
  for (const sgn of [-1, 1]) {
    const ox = nx - sgn*sep, oy = ny + Math.sin(t*1.1 + sgn*1.7)*0.015*(1-k);
    const d2 = ox*ox + oy*oy;
    if (d2 >= R*R) continue;
    const ux = ox/R, uy = oy/R, uz = Math.sqrt(1 - d2/(R*R));
    // each sphere is lit from the side that faces the other one
    const lx = lerp(-sgn*0.62, 0.45, k), ly = -0.35, lz = 0.7;
    const dif = Math.max(0, ux*lx + uy*ly + uz*lz);
    const spec = Math.pow(Math.max(0, ux*lx*0.6 + uy*ly*0.6 + uz*0.8), 26);
    best = Math.max(best, clamp(0.16 + 0.8*dif + 0.9*spec, 0, 1));
  }
  return best;
}

// ---------- timeline ----------
const LOOP = 20;
function state(t, now){
  const s = {};
  let open = 1 - Math.max(bump(t, 1.9, 0.15), bump(t, 3.7, 0.13), bump(t, 4.05, 0.11), bump(t, 17.6, 0.15));
  open = Math.min(open, smooth(0.2, 1.0, t));
  s.open = Math.min(open, 1 - smooth(18.6, 19.6, t) * 0.9);
  let gx = Math.sin(t*1.1)*0.75 + Math.sin(t*2.7)*0.2, gy = Math.sin(t*0.8 + 1)*0.55;
  if (now - lastMove < 2.5) { gx = clamp(px*1.3, -1, 1); gy = clamp(py*1.3, -1, 1); }
  const lock = smooth(4.2, 4.9, t) * (1 - smooth(16.0, 16.8, t));
  s.gx = lerp(gx, 0, lock); s.gy = lerp(gy, 0, lock);
  s.dil = 1 + 0.6*smooth(4.8, 7, t) * (1 - smooth(15, 17, t));

  const base = basePx();
  const pupilPx = RP * 1.6 / base;                  // pupil radius in px at zoom 1 (dilated)
  const zIn = (Math.hypot(W, H) * 0.62) / pupilPx;  // zoom where the pupil swallows the screen
  const zOut = (0.46 * H / 2) / pupilPx;            // zoom where the pupil is as big as the merged sphere
  if (t < 5) s.zoom = 1;
  else if (t < 7.6) s.zoom = Math.exp(Math.pow(smooth(5, 7.6, t), 1.7) * Math.log(zIn));
  else if (t < 13.5) s.zoom = zIn;
  else if (t < 16.6) s.zoom = Math.exp(Math.pow(1 - smooth(13.5, 16.6, t), 1.5) * Math.log(zOut));
  else s.zoom = 1;
  s.camT = t < 10 ? smooth(4.4, 6.0, t) : 1 - smooth(14.0, 16.6, t);   // 1 = camera on the left pupil
  s.space = smooth(7.2, 7.7, t) * (1 - smooth(13.35, 13.6, t));
  s.spaceT = t - 7.4;
  s.orbA = smooth(8.3, 9.2, t);
  s.orb = t > 13 ? 1 - smooth(15.2, 16.8, t) : 0;
  s.fade = smooth(0, 0.8, t) * (1 - smooth(19.2, 20, t));
  return s;
}
function basePx(){ return (W >= H ? 2.05 : 1.55) / W; }   // world units per pixel at zoom 1

// ---------- render ----------
const LEVELS = 12;
const PAL = [
  i => [lerp(40, 232, i), lerp(44, 236, i), lerp(52, 246, i)],     // face: grey-white
  i => [lerp(70, 255, i), lerp(28, 196, i*i), lerp(64, 226, i)],   // spheres: pink
  i => [lerp(90, 235, i), lerp(110, 245, i), lerp(150, 255, i)],   // sparkles: cold white
];
const COLORS = PAL.map(f => Array.from({length: LEVELS}, (_, l) => { const c = f(Math.pow((l + 0.5) / LEVELS, 0.85)).map(Math.round); return `rgb(${c})`; }));
const buckets = PAL.map(() => Array.from({length: LEVELS}, () => []));

function put(c, r, v, ch_, tn){
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const i = r*cols + c;
  if (v <= val[i]) return;
  val[i] = v; chr[i] = ch_.charCodeAt(0); tint[i] = tn;
}

const t0 = performance.now()/1000;
function frame(){
  const now = performance.now()/1000;
  const t = (now - t0) % LOOP;
  const s = state(t, now);
  const slow = Math.floor(now * 3);

  const upp = basePx() / s.zoom;
  const tx = -EX + s.gx*0.11, ty = s.gy*0.05;
  const camX = lerp(0, tx, s.camT), camY = lerp(-0.07, ty, s.camT);
  const halfH = H / 2;

  val.fill(0); tint.fill(0);
  for (let r = 0; r < rows; r++) {
    const sy = (r + 0.5) * ch;
    for (let c = 0; c < cols; c++) {
      const sx = (c + 0.5) * cw, i = r*cols + c;
      const hsh = hash(c*1.7 + 0.3, r*2.9 + 0.7);
      let v = 0, tn = 0;
      if (s.space < 1) {
        v = face(camX + (sx - W/2) * upp, camY + (sy - H/2) * upp, s);
        if (ORB > 0.3) tn = 1;
      }
      if (s.space > 0) {
        const o = orbs((sx - W/2) / halfH, (sy - H/2) / halfH, s.spaceT) * s.orbA;
        v = lerp(v, o, s.space);
        if (o > 0.08) tn = 1;
      }
      v = v * s.fade + (hsh - 0.5) * 0.05;
      if (v < 0.07) continue;
      v = Math.min(1, v);
      const band = BANDS[Math.min(NB - 1, Math.floor(v * NB))];
      const pick = Math.floor(hash(c + (hsh > 0.93 ? slow : 0), r * 1.3) * band.length);
      val[i] = v; chr[i] = band.charCodeAt(pick); tint[i] = tn;
    }
  }

  // sparkle flares inside the pupil
  if (s.space > 0.01) {
    const st = s.spaceT;
    const fadeS = s.space * (1 - smooth(2.6, 4.2, st) * 0.85);
    for (const p of SPARK) {
      const z = p.z - st * 0.55;
      const zz = ((z % 4) + 4) % 4 + 0.35;
      const sx = W/2 + (p.x / zz) * halfH, sy = H/2 + (p.y / zz) * halfH;
      const c = Math.round(sx / cw - 0.5), r = Math.round(sy / ch - 0.5);
      const tw = 0.55 + 0.45*Math.sin(now*4 + p.ph);
      const b = clamp((1.6 / zz) * tw, 0, 1) * fadeS;
      if (b < 0.12) continue;
      const arm = Math.round(1 + 4 / zz);
      put(c, r, b, b > 0.6 ? '@' : 'o', 2);
      for (let k = 1; k <= arm; k++) {
        const f = b * (1 - k/(arm + 1));
        const ch_ = k === arm ? '.' : '-';
        put(c - k, r, f, ch_, 2); put(c + k, r, f, ch_, 2);
        if (k <= Math.ceil(arm/2)) { put(c, r - k, f, k === Math.ceil(arm/2) ? "'" : '|', 2); put(c, r + k, f, k === Math.ceil(arm/2) ? "'" : '|', 2); }
      }
    }
  }

  for (const tb of buckets) for (const b of tb) b.length = 0;
  for (let i = 0; i < N; i++) {
    const v = val[i]; if (v < 0.07 || chr[i] === 32) continue;
    buckets[tint[i]][Math.min(LEVELS - 1, Math.floor(v * LEVELS))].push(i);
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.font = `${fs}px ui-monospace, Menlo, Consolas, "Courier New", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let tn = 0; tn < buckets.length; tn++) for (let l = 0; l < LEVELS; l++) {
    const b = buckets[tn][l]; if (!b.length) continue;
    ctx.fillStyle = COLORS[tn][l];
    for (const i of b) {
      const c = i % cols, r = (i - c) / cols;
      ctx.fillText(String.fromCharCode(chr[i]), (c + 0.5) * cw, (r + 0.5) * ch);
    }
  }
  gctx.clearRect(0, 0, W, H);
  gctx.drawImage(cv, 0, 0, W, H);
  title.style.opacity = (t > 0.8 && t < 4.6) ? 0.9 : 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
